<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Socion — Your Type</title>
<meta name="description" content="Your Socion reading: your type, your Model A structure, and the language it was read from.">
<link rel="preload" href="/static/vendor/fonts/big-shoulders-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/vendor/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/socion.css">
<style>
  .stage{transition:opacity .6s var(--ease);}
  .stage.receded{opacity:.05;}

  /* labels projected beside each module of the 3D Model A */
  .labels{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity .8s var(--ease);}
  .labels.on{opacity:1;}
  .labels.receded{opacity:0;}
  .mlabel{position:absolute; top:0; left:0; white-space:nowrap; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); display:flex; gap:8px; align-items:baseline; will-change:transform;}
  .mlabel b{color:var(--ink); font-weight:500; font-size:.82rem; letter-spacing:.04em;}
  .mlabel .blk{color:var(--ink-faint);}
  .mlabel.ego .blk, .mlabel.ego{color:var(--signal);}
  .mlabel.locked b{color:var(--ink-faint);}
  @media (max-width:899px){ .mlabel{font-size:.6rem; gap:5px;} .mlabel .blk{display:none;} .mlabel b{font-size:.72rem;} .type-code{font-size:clamp(4.4rem,20vw,6rem);} .reveal{padding-bottom:6svh;} }

  /* ---------- reveal ---------- */
  .reveal{position:relative; z-index:2; min-height:100svh; display:flex; align-items:flex-end; padding:120px var(--gutter) 9svh;}
  .reveal-inner{display:grid; gap:18px; max-width:540px;}
  .reveal-status{font-family:var(--f-mono); font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim);}
  .type-code{font-family:var(--f-display); font-weight:900; font-size:clamp(5.5rem,20vw,12rem); line-height:.82; letter-spacing:.01em;}
  .type-name{font-size:1.15rem; color:var(--ink);}
  .type-sub{font-size:.92rem; color:var(--ink-dim);}
  .notation{display:flex; align-items:center; gap:18px; margin-top:4px;}
  .notation .pair{display:flex; align-items:center; gap:10px; font-family:var(--f-mono); font-size:.78rem; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase;}
  .notation .glyph{font-size:30px;}
  .notation .pair b{color:var(--ink); font-weight:500;}
  .reveal [data-step]{opacity:0; transform:translateY(12px); transition:opacity .7s var(--ease), transform .7s var(--ease);}
  .reveal.shown [data-step]{opacity:1; transform:none;}
  .reveal.shown [data-step="2"]{transition-delay:.15s;} .reveal.shown [data-step="3"]{transition-delay:.3s;} .reveal.shown [data-step="4"]{transition-delay:.45s;}
  .scroll-cue{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.16em; color:var(--ink-faint); text-transform:uppercase; margin-top:18px;}
  @media (min-width:900px){ .reveal{align-items:center;} }

  /* ---------- report ---------- */
  .report{position:relative; z-index:2; padding:0 var(--gutter) 120px; display:grid; gap:110px;}
  .report > section{max-width:1080px; width:100%; margin-inline:auto; display:grid; gap:28px;}
  .sec-head{display:grid; gap:12px; max-width:640px;}
  .sec-head h2{font-size:clamp(2rem,5vw,3.4rem);}
  .sec-head p{color:var(--ink-dim); font-size:1.02rem;}
  .meterline{display:flex; align-items:center; gap:14px; font-family:var(--f-mono); font-size:.78rem; color:var(--ink-dim); letter-spacing:.08em;}
  .meterline .bar{flex:0 0 170px; height:10px; border-radius:var(--r-pill); background:var(--well); box-shadow:var(--sh-inset); position:relative;}
  .meterline .bar i{position:absolute; top:2px; bottom:2px; left:2px; max-width:calc(100% - 4px); border-radius:var(--r-pill); background:linear-gradient(180deg,var(--copper-hi),var(--copper-lo)); box-shadow:0 0 8px rgba(226,101,47,.45);}
  .meterline b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums;}

  .cards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px;}
  @media (max-width:760px){ .cards{grid-template-columns:1fr;} }
  .card{background:linear-gradient(180deg,var(--surface-hi),var(--surface)); border:1px solid rgba(255,255,255,.045); border-radius:var(--r-lg); box-shadow:var(--sh-raised); padding:28px; display:grid; gap:16px; align-content:start; min-width:0;}
  .card-head{display:flex; align-items:center; gap:16px;}
  .card-head .glyph{font-size:40px;}
  .card-head .slot{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--signal);}
  .card-head h3{font-size:1.7rem; line-height:1;}
  .card-head .plain{font-size:.85rem; color:var(--ink-dim); font-family:var(--f-body); text-transform:none;}
  .card p{color:var(--ink-dim); font-size:.95rem;}
  .card p.meaning{color:var(--ink); font-size:1.02rem;}
  .quote{margin:0; background:var(--well); box-shadow:var(--sh-inset); border-radius:var(--r-md); border-left:3px solid var(--signal); padding:14px 16px; font-size:1rem; color:var(--ink); font-style:normal;}
  .quote::before{content:"From your answers"; display:block; font-family:var(--f-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .scores{display:flex; flex-wrap:wrap; gap:6px 18px; font-family:var(--f-mono); font-size:.72rem; color:var(--ink-dim); letter-spacing:.04em;}
  .scores b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums;}

  /* evidence chain */
  .chain{display:grid; gap:0; max-width:760px; padding:8px clamp(18px,3vw,32px); background:linear-gradient(180deg,var(--surface-hi),var(--surface)); border:1px solid rgba(255,255,255,.045); border-radius:var(--r-lg); box-shadow:var(--sh-raised);}
  .link{display:grid; grid-template-columns:150px 1fr; gap:20px; padding:22px 0; border-top:1px solid var(--line); align-items:baseline;}
  .link:first-child{border-top:none;}
  .link .k{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);}
  .link .v{font-size:1.08rem; min-width:0;}
  .link .v .glyph{font-size:22px; margin-right:8px;}
  .link.answer .v{font-size:1.25rem; line-height:1.45;}
  .link.type .v{font-family:var(--f-display); font-weight:900; font-size:2.4rem; line-height:1;}
  .arrow-down{display:block; color:var(--signal); font-family:var(--f-mono); font-size:.8rem;}
  @media (max-width:560px){ .link{grid-template-columns:1fr; gap:8px;} }
  .chain .link{opacity:1; transform:none; transition:opacity .6s var(--ease), transform .6s var(--ease);}
  .chain.armed .link{opacity:0; transform:translateX(-10px);}
  .chain.armed.in .link{opacity:1; transform:none;}
  .chain.armed.in .link:nth-child(2){transition-delay:.12s;} .chain.armed.in .link:nth-child(3){transition-delay:.24s;} .chain.armed.in .link:nth-child(4){transition-delay:.36s;} .chain.armed.in .link:nth-child(5){transition-delay:.48s;}

  .why{display:grid; gap:14px; max-width:680px; font-size:1.02rem;}
  .why p{color:var(--ink-dim);}
  .why p strong{color:var(--ink); font-weight:500;}

  /* locked */
  .locked-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px;}
  @media (max-width:760px){ .locked-grid{grid-template-columns:1fr;} }
  .locked{background:var(--well); border-radius:var(--r-lg); box-shadow:var(--sh-inset); border:1px solid rgba(255,255,255,.025); padding:26px; display:grid; gap:12px; min-width:0;}
  .locked .blkname{font-family:var(--f-display); font-weight:800; font-size:1.6rem; text-transform:uppercase;}
  .locked .slots{display:flex; gap:12px;}
  .locked .slots span{width:38px; height:38px; border-radius:var(--r-sm); background:linear-gradient(180deg,#1d1d21,#141416); box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 2px 3px 6px rgba(0,0,0,.6); display:grid; place-items:center; font-family:var(--f-mono); color:var(--ink-faint); font-size:.8rem;}
  .locked p{color:var(--ink-dim); font-size:.9rem;}

  .upgrade{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px;}
  @media (max-width:860px){ .upgrade{grid-template-columns:1fr;} }
  .offer{background:linear-gradient(180deg,var(--surface-hi),var(--surface)); border:1px solid rgba(255,255,255,.045); border-radius:var(--r-lg); box-shadow:var(--sh-raised); padding:32px; display:grid; gap:18px; align-content:start;}
  .offer.main{border-color:rgba(226,101,47,.35); box-shadow:var(--sh-raised), 0 0 40px rgba(226,101,47,.08);}
  .offer .price{font-family:var(--f-display); font-weight:900; font-size:3.4rem; line-height:1;}
  .offer h3{font-size:1.7rem;}
  .offer ul{list-style:none; margin:0; padding:0; display:grid; gap:9px; color:var(--ink-dim); font-size:.95rem;}
  .offer li{display:flex; gap:10px;}
  .offer li::before{content:""; width:8px; height:8px; margin-top:.55em; flex-shrink:0; border-radius:50%; background:linear-gradient(180deg,var(--copper-hi),var(--copper-lo)); box-shadow:0 0 6px rgba(226,101,47,.55);}
  .offer .fine{font-size:.8rem; color:var(--ink-faint);}
  .pay-msg{font-size:.9rem; color:var(--signal); min-height:1.3em;}
  .stagesmini{display:flex; align-items:center; gap:10px; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); flex-wrap:wrap;}
  .stagesmini span.sep{color:var(--signal);}

  .blocksec{display:grid; gap:18px;}
  .blocksec .bh{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;}
  .blocksec .bh h3{font-size:clamp(1.6rem,3.4vw,2.3rem);}
  .blocksec .bh .label{color:var(--ink-faint);}
  .lines{display:grid; gap:12px; max-width:720px;}
  .lines p{color:var(--ink-dim);}
  .lines p strong{color:var(--ink); font-weight:500;}
  .dual{display:flex; align-items:center; gap:24px; flex-wrap:wrap; padding:24px 28px; background:linear-gradient(180deg,var(--surface-hi),var(--surface)); border:1px solid rgba(255,255,255,.045); border-radius:var(--r-lg); box-shadow:var(--sh-raised);}
  .dual .code{font-family:var(--f-display); font-weight:900; font-size:3.6rem; line-height:1;}
  .chip{display:inline-block; font-family:var(--f-mono); font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; padding:5px 11px; border-radius:var(--r-pill); background:var(--well); box-shadow:var(--sh-inset); color:var(--ink-dim); white-space:nowrap;}
  .chip.upheld{color:var(--ink); box-shadow:var(--sh-inset), 0 0 0 1px rgba(255,255,255,.12);}
  .chip.revised{color:#fff; background:linear-gradient(180deg,var(--copper-hi),var(--copper-lo)); box-shadow:var(--glow);}
  .vnote{display:grid; grid-template-columns:auto 1fr auto; gap:8px 16px; align-items:center; padding:16px 0; border-top:1px solid var(--line);}
  .vnote .glyph{font-size:22px;}
  .vnote p{color:var(--ink-dim); font-size:.92rem; margin:0;}
  .status-banner{background:linear-gradient(180deg,#2a2016,#1e1813); border:1px solid rgba(226,101,47,.3); border-radius:var(--r-md); box-shadow:var(--sh-raised); padding:18px 22px; color:var(--ink-dim); font-size:.95rem;}
  .status-banner strong{color:var(--ink); font-weight:500;}

  .devbar{position:fixed; left:var(--gutter); bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:30; display:flex; gap:8px; align-items:center; background:#2a1408; border:1px dashed var(--signal); border-radius:var(--r-sm); padding:8px 10px; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.08em; color:var(--signal); text-transform:uppercase;}
  .devbar button{background:none; border:1px solid var(--signal); color:var(--signal); font:inherit; padding:4px 8px; cursor:pointer;}

  .fail{min-height:100svh; display:grid; place-items:center; position:relative; z-index:2; padding:var(--gutter); text-align:left;}
  .fail > div{max-width:520px; display:grid; gap:18px;}
  footer.foot{position:relative; z-index:2; padding:40px var(--gutter) 60px; border-top:1px solid var(--line); color:var(--ink-faint); font-size:.78rem; max-width:1080px; margin:0 auto;}
</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="structure" aria-hidden="true"></canvas></div>
<div class="labels" id="labels" aria-hidden="true"></div>

<header class="topbar">
  <a class="wordmark" href="/">SOCI<span>O</span>N</a>
  <a class="textlink" href="/test">Retake</a>
</header>

<section class="reveal" id="reveal">
  <div class="reveal-inner">
    <div class="reveal-status" id="reveal-status">The structure is complete</div>
    <div data-step="1" class="label signal" id="reveal-eyebrow">Your Socion type</div>
    <div data-step="2" class="type-code" id="type-code">&nbsp;</div>
    <div data-step="3">
      <div class="type-name" id="type-name"></div>
      <div class="type-sub" id="type-sub"></div>
    </div>
    <div data-step="4" class="notation" id="notation"></div>
    <div data-step="4" class="scroll-cue">Scroll into your structure ↓</div>
  </div>
</section>

<main class="report" id="report"></main>
<footer class="foot">Socion readings are generated from your own written answers using classical Model A (Aušra Augustinavičiūtė, 1980–1983). The 3D structure is an abstract visualization of that model, not a map of the brain.</footer>

<script type="module" src="/static/js/result.js"></script>
</body>
</html>
